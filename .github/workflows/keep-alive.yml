# Render's free plan puts the API to sleep after 15 minutes without traffic.
# Pinging the health endpoint every 5 minutes (GitHub's shortest schedule, and
# runs can start a few minutes late) keeps it well inside that window.
#
# Setup: GitHub repo → Settings → Secrets and variables → Actions → Variables
#        → New repository variable: API_URL = https://store-rating-api.onrender.com
name: Keep API awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "API_URL repository variable is not set, skipping."
            exit 0
          fi
          base="${API_URL%/}"
          base="${base%/api}"
          curl --silent --show-error --fail --max-time 120 --retry 3 --retry-delay 10 \
            "$base/api/health"
