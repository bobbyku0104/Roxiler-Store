# Render Blueprint: creates the database, the API and the frontend together.
# Render dashboard → New → Blueprint → select this repository.
# See "Deploying to Render" in README.md for the full walkthrough.

databases:
  - name: store-rating-db
    plan: free
    region: singapore
    databaseName: store_rating
    user: store_rating

services:
  - type: web
    name: store-rating-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    # Migrations and seed are idempotent, so running them on every start is safe
    # (the free plan has no pre-deploy command).
    startCommand: npm run db:setup && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: store-rating-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: TRUST_PROXY
        value: "1"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: ADMIN_NAME
        value: System Administrator Account
      - key: ADMIN_EMAIL
        value: admin@storerating.com
      # Asked for when the Blueprint is created
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: store-rating-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Asked for when the Blueprint is created
      - key: VITE_API_URL
        sync: false
    routes:
      # Let React Router handle deep links such as /admin/users
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
